# 플랫폼 정의 — 게임 포스트의 links[].platform 값은 아래 키 중 하나여야 합니다.
#   label : 기존 배지/플랫폼 페이지에 쓰던 표기 (이모지 포함)
#   icon  : 버튼·카드·목록에 이름 앞에 붙는 이모지
#   name  : 버튼에 보이는 이름
#   kind  : web(브라우저에서 바로 플레이) / store(앱 스토어) / app(앱인앱)
#   os    : any / android / ios / desktop / mobile — 방문자 기기별 메인 버튼 선택에 사용
#   color : 브랜드 색, text: 버튼 글자색(밝은 배경일 때만 지정)
#   page  : 플랫폼 페이지 주소
